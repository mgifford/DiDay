name: Monthly reminder

on:
  schedule:
    # Daily at 13:00 UTC (morning across Canada). Posts only on the first
    # Sunday; the other days delete reminders older than 30 days.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: Post and delete for real (otherwise a dry run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Post or clean up
        run: node scripts/reminders.js ${{ (github.event_name == 'schedule' || inputs.live) && '--post' || '' }}
        env:
          MASTODON_POSTING_TOKEN: ${{ secrets.MASTODON_POSTING_TOKEN }}
          MASTODON_APP_NAME: DI.DAY Canada reminders
      - name: Add the text to the run summary (for posting on Gander)
        if: always()
        run: test -f reports/reminder.md && cat reports/reminder.md >> "$GITHUB_STEP_SUMMARY" || true
