name: Test Mastodon post (temporary)

# One-off check that the MSTDN secret works. Posts a single plain
# status to confirm the token and account are set up correctly. Delete
# this workflow file once the check has run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-post:
    runs-on: ubuntu-latest
    steps:
      - name: Post a test status
        env:
          MSTDN: ${{ secrets.MSTDN }}
        run: |
          if [ -z "$MSTDN" ]; then
            echo "::error::MSTDN is not set"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST https://mstdn.ca/api/v1/statuses \
            -H "Authorization: Bearer $MSTDN" \
            --data-urlencode "status=Hello Canada! (test post from First Sunday's GitHub Actions setup, safe to ignore or delete)" \
            --data-urlencode "visibility=public")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n1)
          echo "HTTP status: $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Post failed with HTTP $code"
            exit 1
          fi
          url=$(echo "$body" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).url')
          echo "Posted: $url" >> "$GITHUB_STEP_SUMMARY"
