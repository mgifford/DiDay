name: Mastodon inbox

on:
  schedule:
    # Daily, so people who report on Mastodon are not left waiting a week.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Turn public mentions into issues
        run: node scripts/mastodon-inbox.js --create
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          GH_TOKEN: ${{ github.token }}
