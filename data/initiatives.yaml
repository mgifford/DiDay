- id: koumbit
  name: Koumbit
  website: https://koumbit.org/
  country: CA
  organization_type: cooperative
  categories: [public-infrastructure]
  summary:
    en: A self-managed non-profit collective in Montreal/Tio'tia:ke, running web hosting and system administration on free software since 2004 as an alternative to large technology providers.
    fr: Un collectif autogéré à but non lucratif à Montréal/Tio'tia:ke, qui offre hébergement web et administration système sur logiciels libres depuis 2004 comme solution de rechange aux grands fournisseurs technologiques.
  canadian_connection:
    type: headquartered
    evidence: https://koumbit.org/fr/apropos
  contributions:
    - project: null
      type: hosting
      description:
        en: Hosts and administers websites and mail for community organizations on free software, under cooperative self-management rather than outside ownership.
        fr: Héberge et administre des sites web et du courriel pour des organismes communautaires sur logiciels libres, sous autogestion coopérative plutôt que sous propriété externe.
      sources:
        - https://koumbit.org/fr/apropos
        - https://koumbit.org/fr/services/hebergement
  relationships:
    alternatives: []
    campaigns: []
    themes: [explore-open-source]
  sources:
    - url: https://koumbit.org/fr/apropos
      supports: [organization_type, canadian_connection, categories]
  status: documented-contributor
  featured: true
  featured_rationale:
    en: A worker cooperative that has run shared infrastructure on free software since 2004, which shows that digital independence can be organized democratically rather than only bought from a vendor.
    fr: Une coopérative de travail qui exploite une infrastructure partagée sur logiciels libres depuis 2004, ce qui montre que l'indépendance numérique peut s'organiser démocratiquement au lieu de simplement s'acheter.
  verified: false
  last_reviewed: null

