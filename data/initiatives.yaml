- id: equalitie
  name: eQualitie
  website: https://equalitie.org/
  country: CA
  organization_type: non-profit
  categories: [open-source-development, digital-rights]
  summary:
    en: A Montreal organization that builds and maintains free software for censorship resistance and secure communication, used by civil society and independent media.
    fr: Un organisme montréalais qui construit et maintient des logiciels libres de résistance à la censure et de communication sécurisée, utilisés par la société civile et les médias indépendants.
  canadian_connection:
    type: headquartered
    evidence: https://equalitie.org/about/
  contributions:
    - project: null
      type: upstream-development
      description:
        en: Maintains Ouisync, a peer-to-peer file synchronisation tool, and Ouinet, a library for building censorship-resistant access to content. Both are published under open licences.
        fr: Maintient Ouisync, un outil de synchronisation de fichiers pair à pair, et Ouinet, une bibliothèque pour un accès résistant à la censure. Les deux sont publiés sous licence libre.
      sources:
        - https://github.com/equalitie/ouisync
        - https://github.com/equalitie/ouinet
  relationships:
    alternatives: []
    campaigns: []
    themes: [protect-your-privacy]
  sources:
    - url: https://equalitie.org/about/
      supports: [organization_type, canadian_connection, categories]
  status: documented-contributor
  featured: true
  featured_rationale:
    en: A Canadian organization maintaining open-source tools that people under censorship use every day, which is the clearest example of Canadian work on globally shared infrastructure.
    fr: Un organisme canadien qui maintient des outils à code source ouvert utilisés chaque jour par des personnes sous censure, l'exemple le plus clair d'un travail canadien sur une infrastructure partagée à l'échelle mondiale.
  verified: false
  last_reviewed: null

