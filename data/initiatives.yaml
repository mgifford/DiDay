- id: fnigc
  name: First Nations Information Governance Centre
  website: https://fnigc.ca/
  country: CA
  organization_type: non-profit
  categories: [indigenous-data-sovereignty]
  summary:
    en: An Ontario-based First Nations organization that publishes and teaches the OCAP® principles, the First Nations standards for owning, controlling, accessing and possessing data about their communities.
    fr: Un organisme des Premières Nations établi en Ontario qui publie et enseigne les principes OCAP®, les normes des Premières Nations sur la propriété, le contrôle, l'accès et la possession des données les concernant.
  canadian_connection:
    type: headquartered
    evidence: https://fnigc.ca/
  contributions:
    - project: null
      type: standards
      description:
        en: Publishes the OCAP® principles and the training that goes with them, which set out how First Nations data is governed, in the First Nations' own terms rather than in a general open-data frame.
        fr: Publie les principes OCAP® et la formation qui les accompagne, qui définissent la gouvernance des données des Premières Nations selon leurs propres termes plutôt que dans un cadre général de données ouvertes.
      sources:
