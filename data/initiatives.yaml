# Canadian ecosystem directory.
#
# The rules are in docs/ECOSYSTEM-EDITORIAL-POLICY.md, the record format in
# docs/ECOSYSTEM-SCHEMA.md, and the validator in lib/initiatives.js. All three
# were merged before this file existed, so the data cannot bend the rules.
#
# Research and sources: docs/ECOSYSTEM-RESEARCH.md. Checked 2026-11-12.
#
# Nothing here is verified: no maintainer has reviewed these records yet, and
# the site says so on every entry. `verified: true` and `last_reviewed` are set
# by a person, never by a check.
#
# status:
#   documented-contributor  the named contribution was read at its source
#   listed                  the Canadian connection is confirmed, but the
#                           contribution rests on a source that could not be
#                           read by the researcher (CIRA and FNIGC both block
#                           automated requests) and needs a person
#
# Order is editorial. It is not a ranking.

- id: openmedia
  name: OpenMedia
  website: https://openmedia.org/
  country: CA
  organization_type: non-profit
  categories: [digital-rights]
  summary:
    en: A Vancouver non-profit that campaigns for an open, affordable and surveillance-free internet, and publishes policy analysis on how platforms are regulated in Canada and the United States.
    fr: Un organisme sans but lucratif de Vancouver qui milite pour un internet ouvert, abordable et sans surveillance, et publie des analyses sur la réglementation des plateformes au Canada et aux États-Unis.
  canadian_connection:
    type: headquartered
    evidence: https://openmedia.org/contact
  contributions:
    - project: null
      type: advocacy
      description:
        en: Publishes policy analysis aimed at Canadian and U.S. platform regulation, including work on safety-by-design rules that do not depend on surveillance.
        fr: Publie des analyses de politiques visant la réglementation des plateformes au Canada et aux États-Unis, notamment sur des règles de sécurité dès la conception qui ne reposent pas sur la surveillance.
      sources:
        - https://openmedia.org/article/item/safety-by-design-how-platforms-can-reduce-harm-without-more-surveillance
  relationships:
    alternatives: []
    campaigns: []
    themes: [protect-your-privacy]
  sources:
    - url: https://openmedia.org/about
      supports: [organization_type, categories]
    - url: https://openmedia.org/contact
      supports: [canadian_connection]
  status: documented-contributor
  featured: false
  featured_rationale: null
  verified: false
  last_reviewed: null

