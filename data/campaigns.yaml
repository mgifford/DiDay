- id: resist-and-unsubscribe
  name: Resist and Unsubscribe
  url: https://www.resistandunsubscribe.com/
  country: US
  description:
    en: "Scott Galloway's 2026 call for a one-month economic strike against Big Tech subscriptions. This site's cancel links follow its lead."
    fr: "L'appel lancé en 2026 par Scott Galloway à une grève économique d'un mois contre les abonnements aux géants du numérique. Les liens d'annulation de ce site s'en inspirent."
  sources:
    - title: "Resist and Unsubscribe (No Mercy / No Malice)"
      url: https://www.profgalloway.com/resist-and-unsubscribe/
    - title: "Big Tech Boycott February 2026 (IBTimes UK)"
      url: https://www.ibtimes.co.uk/big-tech-boycott-february-2026-scott-galloways-resist-unsubscribe-campaign-targets-amazon-1776233
  verified: true
  last_reviewed: 2026-09-29

