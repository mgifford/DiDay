name:
  en: DI.DAY Canada
  fr: DI.DAY Canada
tagline:
  en: On the first Sunday of every month, move one service away from Big Tech.
  fr: Le premier dimanche de chaque mois, quittez un service des géants du numérique.
# Public address of the site, without a trailing slash. Used in reminder posts.
# Leave null until the site is live; reminders are not posted without it.
url: https://diday.ca
# Replace with the real repository URL.
repo: https://github.com/mgifford/DiDay
# Project account on mstdn.ca for reports from people without a GitHub account.
# Written as "@name@mstdn.ca". Leave null until the account exists; this hides
# the Mastodon option on the site and turns off the Mastodon inbox job.
mastodon: "@DIDay@mstdn.ca"
# Project handle on Gander (gandersocial.ca), an AT Protocol app. Leave null
# until the account exists; this hides the Gander link on the site. No public
# posting API exists yet (see README.md's Gander section), so this is a
# profile link only, not a reporting or automation channel.
gander: diday.gander.social
# Where the "report a problem" links open. Uses the issue form in
# .github/ISSUE_TEMPLATE/out-of-date.yml. Change this if the project moves host.
report_url: https://github.com/mgifford/DiDay/issues/new?template=out-of-date.yml
languages:
  - en
  - fr
