# difficulty: easy | average | hard
# Steps are a real sequence, so they render as an ordered list.
- id: ebooks-without-amazon
  title:
    en: Reading e-books without Amazon
    fr: Lire des livres numériques sans Amazon
  summary:
    en: Move your e-books off Kindle, borrow from a public library, and buy EPUB files you keep.
    fr: Transférez vos livres numériques hors de Kindle, empruntez à la bibliothèque publique et achetez des fichiers EPUB que vous conservez.
  minutes: 30
  difficulty: easy
  replaces: [kindle-unlimited]
  alternatives: [kobo, public-library]
  steps:
    en:
      - List the books you have on Kindle. Books bought from Amazon usually stay tied to Kindle apps and devices.
      - Get a card from your public library and ask which e-book apps it supports.
      - Buy new books from Kobo or another store that sells EPUB files.
      - Cancel Kindle Unlimited once you have returned your current borrowed books.
    fr:
      - Faites la liste de vos livres Kindle. Les livres achetés chez Amazon restent en général liés aux applications et appareils Kindle.
      - Procurez-vous une carte de votre bibliothèque publique et demandez quelles applications de livres numériques elle prend en charge.
      - Achetez vos nouveaux livres chez Kobo ou dans une autre librairie qui vend des fichiers EPUB.
      - Annulez Kindle Unlimited une fois vos emprunts en cours rendus.
  verified: false

- id: email-without-google
  title:
    en: Email without Gmail
    fr: Le courriel sans Gmail
  summary:
    en: Move your email and contacts from Gmail to a provider you choose, without losing messages.
    fr: Transférez vos courriels et vos contacts de Gmail vers un fournisseur de votre choix, sans perdre de messages.
  minutes: 60
  difficulty: average
  replaces: []
  alternatives: [hushmail, proton-mail]
  steps:
    en:
      - Open an account with the new provider.
      - Turn on forwarding in Gmail so new mail reaches the new address.
      - Export your Gmail contacts and import them into the new service.
      - Update your email address with your bank, government services and other important accounts.
      - Keep the Gmail account open for a few months to catch anything you missed.
    fr:
      - Ouvrez un compte chez le nouveau fournisseur.
      - Activez le transfert dans Gmail pour que les nouveaux messages arrivent à la nouvelle adresse.
      - Exportez vos contacts Gmail et importez-les dans le nouveau service.
      - Mettez à jour votre adresse auprès de votre banque, des services gouvernementaux et de vos autres comptes importants.
      - Gardez le compte Gmail ouvert quelques mois pour ne rien manquer.
  verified: false

- id: calls-without-zoom
  title:
    en: Video calls without Zoom or Teams
    fr: Appels vidéo sans Zoom ni Teams
  summary:
    en: Run one-off or regular video calls on Jitsi, BigBlueButton or Element instead of Zoom or Teams.
    fr: Faites vos appels vidéo ponctuels ou réguliers sur Jitsi, BigBlueButton ou Element au lieu de Zoom ou Teams.
  minutes: 15
  difficulty: easy
  replaces: []
  alternatives: [bigbluebutton, jitsi-meet, element]
  steps:
    en:
      - For a one-off call, go to meet.jit.si, start a meeting and send the link. No account needed.
      - For classes or structured group sessions, look into BigBlueButton, a Canadian open-source tool built for teaching.
      - For calls with the same people regularly, create a free Element account instead, so you have a permanent room to invite people back to.
      - Send the new link or invite instead of a Zoom or Teams link next time you schedule a call.
      - Tell the other participants a week ahead, since a new tool can catch people off guard.
    fr:
      - Pour un appel ponctuel, allez sur meet.jit.si, démarrez une réunion et envoyez le lien. Aucun compte requis.
      - Pour des cours ou des séances de groupe structurées, envisagez BigBlueButton, un outil canadien à code source ouvert conçu pour l'enseignement.
      - Pour des appels réguliers avec les mêmes personnes, créez plutôt un compte Element gratuit, pour avoir un salon permanent où les réinviter.
      - Envoyez le nouveau lien ou la nouvelle invitation à la place d'un lien Zoom ou Teams la prochaine fois que vous planifiez un appel.
      - Prévenez les autres participants une semaine à l'avance, car un nouvel outil peut en dérouter certains.
  verified: false

- id: social-without-facebook
  title:
    en: Social media without Facebook or X
    fr: Réseaux sociaux sans Facebook ni X
  summary:
    en: Set up an account on Gander or Mastodon and bring your followers with you from Facebook or X.
    fr: Ouvrez un compte sur Gander ou Mastodon et amenez vos abonnés avec vous depuis Facebook ou X.
  minutes: 45
  difficulty: average
  replaces: []
  alternatives: [gander, mstdn-ca]
  steps:
    en:
      - Pick a new platform. Gander suits general posting and following friends; a Mastodon server such as mstdn.ca suits following people and topics across many other servers, not just one company's app.
      - Create your account there and post a link to it from your old accounts, so people can find you.
      - Follow the same people or organizations again. There is no automatic way to copy followers between unrelated platforms, so this part takes time.
      - Post on both the old and new account for a few weeks, so your existing followers have time to notice and move with you.
      - Once most of your regular contacts have moved, stop posting on the old account and update its bio to point to the new one.
    fr:
      - Choisissez une nouvelle plateforme. Gander convient pour publier et suivre ses amis en général; un serveur Mastodon comme mstdn.ca convient pour suivre des personnes et des sujets à travers de nombreux autres serveurs, pas seulement l'application d'une seule entreprise.
      - Créez-y votre compte et publiez un lien vers celui-ci depuis vos anciens comptes, pour que les gens puissent vous y retrouver.
      - Suivez à nouveau les mêmes personnes ou organismes. Il n'existe aucun moyen automatique de copier des abonnés entre des plateformes sans lien entre elles, alors cette étape prend du temps.
      - Publiez à la fois sur l'ancien et le nouveau compte pendant quelques semaines, pour laisser à vos abonnés actuels le temps de le remarquer et de vous suivre.
      - Une fois que la plupart de vos contacts habituels ont migré, cessez de publier sur l'ancien compte et mettez à jour sa biographie pour pointer vers le nouveau.
  verified: false

- id: music-without-streaming
  title:
    en: Music without Apple, Amazon or YouTube Music
    fr: De la musique sans Apple, Amazon ni YouTube
  summary:
    en: Keep the albums you actually listen to, add free Canadian radio, and cancel the music subscription.
    fr: Conservez les albums que vous écoutez vraiment, ajoutez la radio canadienne gratuite et annulez l'abonnement musical.
  minutes: 45
  difficulty: average
  replaces: [apple-music, amazon-music, youtube-music]
  alternatives: [stingray-music, qobuz, cbc-listen, navidrome]
  steps:
    en:
      - List the albums and playlists you would miss. Playlists do not move between services, so decide which ones you are willing to rebuild.
      - Turn off auto-renewal on the music subscription, but keep it until the paid period ends.
      - Buy the albums you keep playing again from a store that sells files you keep, such as Qobuz, and download them to a computer.
      - Add free listening. CBC Listen carries radio and CBC Music in English, OHdio does the same in French, and Stingray Music has curated channels.
      - If your collection is large, put the files on a computer and stream them to your phone with Navidrome instead of copying them to every device.
      - Cancel the subscription once the albums are downloaded, and tell someone which albums you kept.
    fr:
      - Faites la liste des albums et des listes de lecture qui vous manqueraient. Les listes de lecture ne se transfèrent pas d'un service à l'autre, alors décidez lesquelles vous êtes prêt à refaire.
      - Désactivez le renouvellement automatique de l'abonnement musical, mais gardez-le jusqu'à la fin de la période payée.
      - Achetez les albums que vous réécoutez chez un marchand qui vend des fichiers que vous conservez, comme Qobuz, et téléchargez-les sur un ordinateur.
      - Ajoutez des écoutes gratuites. CBC Listen diffuse la radio et CBC Music en anglais, OHdio fait de même en français, et Stingray Music propose des chaînes sélectionnées.
      - Si votre collection est importante, mettez les fichiers sur un ordinateur et diffusez-les vers votre téléphone avec Navidrome, au lieu de les copier sur chaque appareil.
      - Annulez l'abonnement une fois les albums téléchargés, puis dites à quelqu'un quels albums vous avez conservés.
  verified: false

- id: storage-without-google
  title:
    en: Cloud storage without Google One or iCloud
    fr: Du stockage infonuagique sans Google One ni iCloud
  summary:
    en: Move your photos and files to a provider that does not scan them, then cancel the storage plan.
    fr: Transférez vos photos et vos fichiers vers un fournisseur qui ne les analyse pas, puis annulez le forfait de stockage.
  minutes: 60
  difficulty: hard
  replaces: [google-one, apple-one]
  alternatives: [sync-com, nextcloud, proton-drive, infomaniak-kdrive]
  steps:
    en:
      - Check how much space you use now, so the new plan is the same size or larger.
      - Pick a destination. A Canadian provider such as Sync.com, a Swiss one such as Proton Drive or Infomaniak kDrive, or Nextcloud on a server you control.
      - Download everything first, with Google Takeout or the iCloud data export, and keep that download on a drive you own.
      - Upload the files to the new provider and compare the photo count with the old one before going further.
      - Point the photo backup on your phone at the new app, then take a photo and check that it arrives.
      - Cancel Google One or iCloud+ after a month has passed and nothing is missing.
      - Keep the downloaded copy. A second copy of your photos is what makes the move safe.
    fr:
      - Vérifiez l'espace que vous utilisez actuellement, pour que le nouveau forfait soit de la même taille ou plus grand.
      - Choisissez une destination. Un fournisseur canadien comme Sync.com, un fournisseur suisse comme Proton Drive ou Infomaniak kDrive, ou Nextcloud sur un serveur que vous contrôlez.
      - Téléchargez d'abord tout le contenu, avec Google Takeout ou l'exportation de données d'iCloud, et gardez ce téléchargement sur un disque qui vous appartient.
      - Téléversez les fichiers chez le nouveau fournisseur et comparez le nombre de photos avec l'ancien avant d'aller plus loin.
      - Faites pointer la sauvegarde des photos de votre téléphone vers la nouvelle application, puis prenez une photo et vérifiez qu'elle arrive.
      - Annulez Google One ou iCloud+ après un mois, une fois que rien ne manque.
      - Conservez la copie téléchargée. Une deuxième copie de vos photos, c'est ce qui rend le transfert sûr.
  verified: false
