# difficulty: easy | average | hard
# Steps are a real sequence, so they render as an ordered list.
- id: ebooks-without-amazon
  title:
    en: Reading e-books without Amazon
    fr: Lire des livres numériques sans Amazon
  minutes: 30
  difficulty: easy
  replaces: [kindle-unlimited]
  alternatives: [kobo, public-library]
  steps:
    en:
      - List the books you have on Kindle. Books bought from Amazon usually stay tied to Kindle apps and devices.
      - Get a card from your public library and ask which e-book apps it supports.
      - Buy new books from Kobo or another store that sells EPUB files.
      - Cancel Kindle Unlimited once you have returned your current borrowed books.
    fr:
      - Faites la liste de vos livres Kindle. Les livres achetés chez Amazon restent en général liés aux applications et appareils Kindle.
      - Procurez-vous une carte de votre bibliothèque publique et demandez quelles applications de livres numériques elle prend en charge.
      - Achetez vos nouveaux livres chez Kobo ou dans une autre librairie qui vend des fichiers EPUB.
      - Annulez Kindle Unlimited une fois vos emprunts en cours rendus.
  verified: false

- id: email-without-google
  title:
    en: Email without Gmail
    fr: Le courriel sans Gmail
  minutes: 60
  difficulty: average
  replaces: []
  alternatives: [hushmail, proton-mail]
  steps:
    en:
      - Open an account with the new provider.
      - Turn on forwarding in Gmail so new mail reaches the new address.
      - Export your Gmail contacts and import them into the new service.
      - Update your email address with your bank, government services and other important accounts.
      - Keep the Gmail account open for a few months to catch anything you missed.
    fr:
      - Ouvrez un compte chez le nouveau fournisseur.
      - Activez le transfert dans Gmail pour que les nouveaux messages arrivent à la nouvelle adresse.
      - Exportez vos contacts Gmail et importez-les dans le nouveau service.
      - Mettez à jour votre adresse auprès de votre banque, des services gouvernementaux et de vos autres comptes importants.
      - Gardez le compte Gmail ouvert quelques mois pour ne rien manquer.
  verified: false

- id: calls-without-zoom
  title:
    en: Video calls without Zoom or Teams
    fr: Appels vidéo sans Zoom ni Teams
  minutes: 15
  difficulty: easy
  replaces: []
  alternatives: [bigbluebutton, jitsi-meet, element]
  steps:
    en:
      - For a one-off call, go to meet.jit.si, start a meeting and send the link. No account needed.
      - For classes or structured group sessions, look into BigBlueButton, a Canadian open-source tool built for teaching.
      - For calls with the same people regularly, create a free Element account instead, so you have a permanent room to invite people back to.
      - Send the new link or invite instead of a Zoom or Teams link next time you schedule a call.
      - Tell the other participants a week ahead, since a new tool can catch people off guard.
    fr:
      - Pour un appel ponctuel, allez sur meet.jit.si, démarrez une réunion et envoyez le lien. Aucun compte requis.
      - Pour des cours ou des séances de groupe structurées, envisagez BigBlueButton, un outil canadien à code source ouvert conçu pour l'enseignement.
      - Pour des appels réguliers avec les mêmes personnes, créez plutôt un compte Element gratuit, pour avoir un salon permanent où les réinviter.
      - Envoyez le nouveau lien ou la nouvelle invitation à la place d'un lien Zoom ou Teams la prochaine fois que vous planifiez un appel.
      - Prévenez les autres participants une semaine à l'avance, car un nouvel outil peut en dérouter certains.
  verified: false

- id: social-without-facebook
  title:
    en: Social media without Facebook or X
    fr: Réseaux sociaux sans Facebook ni X
  minutes: 45
  difficulty: average
  replaces: []
  alternatives: [gander, mstdn-ca]
  steps:
    en:
      - Pick a new platform. Gander suits general posting and following friends; a Mastodon server such as mstdn.ca suits following people and topics across many other servers, not just one company's app.
      - Create your account there and post a link to it from your old accounts, so people can find you.
      - Follow the same people or organizations again. There is no automatic way to copy followers between unrelated platforms, so this part takes time.
      - Post on both the old and new account for a few weeks, so your existing followers have time to notice and move with you.
      - Once most of your regular contacts have moved, stop posting on the old account and update its bio to point to the new one.
    fr:
      - Choisissez une nouvelle plateforme. Gander convient pour publier et suivre ses amis en général; un serveur Mastodon comme mstdn.ca convient pour suivre des personnes et des sujets à travers de nombreux autres serveurs, pas seulement l'application d'une seule entreprise.
      - Créez-y votre compte et publiez un lien vers celui-ci depuis vos anciens comptes, pour que les gens puissent vous y retrouver.
      - Suivez à nouveau les mêmes personnes ou organismes. Il n'existe aucun moyen automatique de copier des abonnés entre des plateformes sans lien entre elles, alors cette étape prend du temps.
      - Publiez à la fois sur l'ancien et le nouveau compte pendant quelques semaines, pour laisser à vos abonnés actuels le temps de le remarquer et de vous suivre.
      - Une fois que la plupart de vos contacts habituels ont migré, cessez de publier sur l'ancien compte et mettez à jour sa biographie pour pointer vers le nouveau.
  verified: false
