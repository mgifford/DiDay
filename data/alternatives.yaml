- id: gander
  name: Gander
  url: https://gandersocial.ca/
  category: social
  headquarters: CA
  ownership: CA
  open_source: false
  notes:
    en: Canadian social network, crowdfunded by Canadian investors. It runs on its own network and plans to connect with the Bluesky (AT Protocol) network. It does not connect to Mastodon.
    fr: Réseau social canadien, financé par des investisseurs canadiens. Il fonctionne sur son propre réseau et prévoit de se connecter au réseau Bluesky (protocole AT). Il ne communique pas avec Mastodon.
  sources:
