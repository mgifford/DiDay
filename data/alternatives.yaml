# Inclusion rules (enforced by scripts/validate.js):
#   Listed if Canadian owned, open source, or European owned, ranked in that order.
#   Anything else needs a bilingual "exception" explaining why, and is ranked last.
#   Set draft: true to keep an entry out of the site while it is researched.
#
# Evidence: every claim needs a source that supports it. List the claims each
# source supports under "supports": headquarters, ownership, open_source.
#
# headquarters and ownership use ISO 3166-1 alpha-2 codes, or null if unknown.
# wikidata: the item ID (Q...) used by the weekly ownership check. Optional.
# Wikipedia links are placeholders; prefer primary sources.
- id: kobo
  name: Kobo
  url: https://www.kobo.com/
  wikidata: Q389251
  category: ebooks
  headquarters: CA
  ownership: JP
  open_source: false
  exception:
    en: Based in Toronto but owned by Rakuten of Japan, so it does not meet the ownership rules.
    fr: Siège à Toronto, mais propriété de Rakuten (Japon); ne respecte donc pas les critères de propriété.
  notes:
    en: Kobo e-readers open EPUB files, the format most other stores and libraries use.
    fr: Les liseuses Kobo lisent les fichiers EPUB, le format utilisé par la plupart des autres librairies et bibliothèques.
  sources:
    - title: Kobo Inc. (Wikipedia)
      url: https://en.wikipedia.org/wiki/Kobo_Inc.
      supports: [headquarters, ownership]
  verified: false

