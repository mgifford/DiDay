  en: Monthly themes
  fr: Thèmes mensuels
themes_intro:
  en: One theme for each month, repeating every year. It is a suggestion for where to start, not a requirement.
  fr: Un thème par mois, qui revient chaque année. C'est une suggestion pour savoir par où commencer, pas une obligation.
themes_current:
