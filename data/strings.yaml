# --- Phase 4: the international movement ----------------------------------
world_page_intro:
  en: Digital Independence Day is marked in more than one country, and each country runs its own campaign. These are the ones we have checked, with what each one actually is.
  fr: La Journée de l'indépendance numérique est soulignée dans plus d'un pays, et chaque pays mène sa propre campagne. Voici celles que nous avons vérifiées, avec ce qu'elles sont réellement.
world_relationship_international:
  en: International initiative
  fr: Initiative internationale
world_relationship_campaign:
  en: Related campaign
  fr: Campagne sœur
world_relationship_events:
  en: Event directory
  fr: Répertoire d'événements
world_scope_international:
  en: International
  fr: International
world_checked_label:
  en: Checked against the source
  fr: Vérifié à la source
world_unreviewed:
  en: Not yet reviewed by a maintainer.
  fr: Pas encore vérifié par une personne responsable.
world_org_label:
  en: Run by
  fr: Géré par
world_check_note:
  en: We link to these and do not speak for them. Each description was checked against the source on the date shown.
  fr: Nous renvoyons vers ces sites sans parler en leur nom. Chaque description a été vérifiée à la source à la date indiquée.
world_collab_heading:
  en: Take part internationally
  fr: Participer à l'international
world_collab_intro:
  en: You do not have to stay inside the Canadian campaign. These routes are open to anyone.
  fr: Il n'est pas nécessaire de rester dans la campagne canadienne. Ces pistes sont ouvertes à tout le monde.
world_collab_translate:
  en: Help translate the international site. It is maintained in five languages and takes corrections.
  fr: Aidez à traduire le site international. Il est tenu en cinq langues et accepte les corrections.
world_collab_event:
  en: Publish a Canadian event in the shared calendar, so people looking for something nearby can find it.
  fr: Inscrivez un événement canadien dans le calendrier partagé, pour que les personnes qui cherchent une activité près de chez elles le trouvent.
world_collab_guides:
  en: Share a switch recipe with the international project if yours works better than theirs.
  fr: Partagez une recette avec le projet international si la vôtre fonctionne mieux que la leur.
about_canada_intro:
  en: a directory of Canadian organizations whose work supports digital independence, with a source for every claim.
  fr: un répertoire d'organismes canadiens dont le travail appuie l'indépendance numérique, avec une source pour chaque affirmation.
about_world_intro:
  en: international campaigns and events are listed on their own page.
  fr: les campagnes et événements internationaux sont présentés sur leur propre page.

# --- Phase 5: Canadian ecosystem directory ---------------------------------
nav_canada:
  en: Canada
  fr: Canada
canada_title:
  en: Canadians helping build a more independent internet.
  fr: Des personnes au Canada qui bâtissent un internet plus indépendant.
canada_lead:
  en: Canadian developers, companies, communities and public-interest organizations help build and sustain open digital infrastructure used around the world.
  fr: Des développeurs, des entreprises, des communautés et des organismes d'intérêt public au Canada aident à construire et à maintenir une infrastructure numérique ouverte utilisée partout dans le monde.
canada_why_heading:
  en: Why this directory exists
  fr: Pourquoi ce répertoire existe
canada_why_ownership:
  en: Canadian ownership is not the same thing as digital independence. A Canadian-owned service can still lock in its users, keep its code closed and hold data it will not give back. What matters is whether the technology is open, portable, interoperable and accountable.
  fr: La propriété canadienne n'est pas la même chose que l'indépendance numérique. Un service canadien peut tout de même enfermer ses utilisateurs, garder son code fermé et retenir des données qu'il ne rendra pas. Ce qui compte, c'est que la technologie soit ouverte, portable, interopérable et redevable.
canada_why_global:
  en: Much of the software this site runs on was built by communities rather than companies, and is maintained across borders. Canadians contribute to that work, and those contributions are part of digital independence even when the project is not Canadian and never will be.
  fr: Une bonne partie des logiciels sur lesquels repose ce site ont été construits par des communautés plutôt que par des entreprises, et sont maintenus par-delà les frontières. Des personnes au Canada contribuent à ce travail, et ces contributions font partie de l'indépendance numérique même quand le projet n'est pas canadien et ne le sera jamais.
canada_categories_heading:
  en: Browse by kind of contribution
  fr: Parcourir par type de contribution
canada_how_heading:
  en: How this directory is researched
  fr: Comment ce répertoire est documenté
canada_how_body:
  en:
    - Every organization needs a documented Canadian connection and at least one specific contribution, each with its own source.
    - A link is not evidence. Someone reads the source and checks that it supports the sentence above it.
    - Nothing here is a ranking, an endorsement or a partnership. Inclusion is a statement about one documented contribution, not a verdict on the organization.
    - Organizations can ask to be removed, and corrections are welcome.
  fr:
    - Chaque organisme doit avoir un lien canadien documenté et au moins une contribution précise, chacune avec sa propre source.
    - Un lien n'est pas une preuve. Quelqu'un lit la source et vérifie qu'elle appuie la phrase qui la précède.
    - Rien ici n'est un classement, une approbation ou un partenariat. L'inscription porte sur une contribution documentée, pas sur un jugement global.
    - Un organisme peut demander à être retiré, et les corrections sont bienvenues.
