about_name_explainer:
  en: "DI.DAY stands for Digital Independence Day: an international campaign, started in Germany, to move away from Big Tech on the first Sunday of every month. This site is its Canadian chapter."
  fr: "DI.DAY signifie Digital Independence Day (jour de l'indépendance numérique) : une campagne internationale, lancée en Allemagne, pour se détourner des géants du numérique le premier dimanche de chaque mois. Ce site en est le volet canadien."
about_intro:
  en: A volunteer, open source project. Anyone can propose a change on GitHub.
  fr: Un projet bénévole à code source ouvert. Tout le monde peut proposer une modification sur GitHub.
about_criteria_heading:
  en: What we list
  fr: Ce que nous inscrivons
about_criteria:
  en: We list services that are Canadian owned, open source, or European owned, ranked in that order. Ownership decides, not headquarters. A company based in Toronto but owned abroad does not count as Canadian. Anything outside these rules is labelled as an exception with the reason. Services owned in Russia, Belarus or China are never listed.
  fr: Nous inscrivons les services de propriété canadienne, à code source ouvert ou de propriété européenne, classés dans cet ordre. C'est la propriété qui compte, pas le siège. Une entreprise établie à Toronto mais détenue à l'étranger n'est pas considérée comme canadienne. Tout ce qui sort de ces critères est indiqué comme exception, avec la raison. Les services détenus en Russie, en Biélorussie ou en Chine ne sont jamais inscrits.
about_evidence_heading:
  en: Evidence
  fr: Preuves
about_evidence:
  en: Every claim about headquarters, ownership or open source links to a source that supports it. If something is wrong, open an issue or a pull request with a better source.
  fr: Chaque affirmation sur le siège, la propriété ou le code source ouvert renvoie à une source qui l'appuie. Si une information est inexacte, ouvrez un ticket ou une demande de fusion avec une meilleure source.
about_site_heading:
  en: How this site is built
  fr: Comment ce site est construit
about_site:
  en: No trackers, no cookies, no third-party scripts and no web fonts. Pages are static HTML.
  fr: Aucun traceur, aucun témoin, aucun script tiers et aucune police Web. Les pages sont en HTML statique.
about_campaigns_heading:
  en: Related campaigns
  fr: Campagnes semblables
about_campaigns_intro:
  en: This project is not alone. Other campaigns and organizations are working on the same problem, in Canada and elsewhere.
  fr: Ce projet n'est pas seul. D'autres campagnes et organismes travaillent sur le même enjeu, au Canada et ailleurs.
