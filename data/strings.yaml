# Monthly reminder posts. {url} is replaced with the site address.
# French: non-breaking space (\u00a0) before a colon.
reminder_post:
  en:
    - "Today is DI.DAY. Move one service away from Big Tech: pick a switch recipe, cancel one subscription, and tell someone what you did.\n\n{url}/en/recipes/\n\n#DiDay #DiDayCA"
    - "It's DI.DAY! One subscription, one switch, one less reason for Big Tech to have your data.\n\n{url}/en/recipes/\n\n#DiDay #DiDayCA"
    - "DI.DAY is here. Pick one U.S. service, follow a switch recipe, and cancel it today.\n\n{url}/en/recipes/\n\n#DiDay #DiDayCA"
    - "Today's the day: DI.DAY. Small step, real difference. Switch one service, cancel it, tell a friend.\n\n{url}/en/recipes/\n\n#DiDay #DiDayCA"
  fr:
    - "C'est DI.DAY. Quittez un service des géants du numérique\u00a0: choisissez une recette, annulez un abonnement et parlez-en à quelqu'un.\n\n{url}/fr/recipes/\n\n#DiDay #DiDayCA"
    - "C'est DI.DAY\u00a0! Un abonnement, un changement, une raison de moins pour les géants du numérique d'avoir vos données.\n\n{url}/fr/recipes/\n\n#DiDay #DiDayCA"
    - "DI.DAY est arrivé. Choisissez un service américain, suivez une recette et annulez-le aujourd'hui.\n\n{url}/fr/recipes/\n\n#DiDay #DiDayCA"
    - "Aujourd'hui, c'est DI.DAY. Petit geste, vraie différence. Changez un service, annulez-le, parlez-en.\n\n{url}/fr/recipes/\n\n#DiDay #DiDayCA"
teaser_post:
  en:
    - "DI.DAY is this weekend (first Sunday of the month). Pick the one U.S. service you'll switch away from, so you're ready Sunday.\n\n{url}/en/recipes/\n\n#DiDay #DiDayCA"
    - "Heads up: DI.DAY is Sunday. Have a look at the switch recipes and choose your target.\n\n{url}/en/recipes/\n\n#DiDay #DiDayCA"
    - "This Sunday is DI.DAY. Two days to pick a service to leave behind.\n\n{url}/en/recipes/\n\n#DiDay #DiDayCA"
  fr:
    - "DI.DAY, c'est ce week-end (le premier dimanche du mois). Choisissez dès maintenant le service américain que vous quitterez dimanche.\n\n{url}/fr/recipes/\n\n#DiDay #DiDayCA"
    - "Rappel\u00a0: DI.DAY approche. Jetez un œil aux recettes et choisissez votre cible.\n\n{url}/fr/recipes/\n\n#DiDay #DiDayCA"
    - "Ce dimanche, c'est DI.DAY. Deux jours pour choisir un service à quitter.\n\n{url}/fr/recipes/\n\n#DiDay #DiDayCA"
followup_post:
  en:
    - "How did DI.DAY go? Reply and tell us what you switched, or what got in the way.\n\n{url}/en/recipes/\n\n#DiDay #DiDayCA"
    - "Did you switch something yesterday? Share what worked (or what did not) so others can learn from it.\n\n{url}/en/recipes/\n\n#DiDay #DiDayCA"
    - "DI.DAY was yesterday. What did you move away from? Tell us how it went.\n\n{url}/en/recipes/\n\n#DiDay #DiDayCA"
  fr:
    - "Comment s'est passé DI.DAY\u00a0? Dites-nous ce que vous avez changé, ou ce qui vous en a empêché.\n\n{url}/fr/recipes/\n\n#DiDay #DiDayCA"
    - "Avez-vous changé quelque chose hier\u00a0? Partagez ce qui a fonctionné (ou non) pour aider les autres.\n\n{url}/fr/recipes/\n\n#DiDay #DiDayCA"
    - "DI.DAY, c'était hier. Qu'avez-vous quitté\u00a0? Racontez-nous comment ça s'est passé.\n\n{url}/fr/recipes/\n\n#DiDay #DiDayCA"
public_reports_notice:
  en: If you mention our Mastodon account in a public post, a copy of that post and your handle goes into a public issue on GitHub so we can track it. Other posts and direct messages are never copied.
  fr: Si vous mentionnez notre compte Mastodon dans une publication publique, une copie de cette publication et votre identifiant sont versés dans un ticket public sur GitHub pour en assurer le suivi. Les autres publications et les messages privés ne sont jamais copiés.

# Brand mark, used on the two home pages. The title names the image and the
# description is read after it, so both must describe the drawing, not repeat
# the page heading.
brand_title:
  en: Digital Independence Day
  fr: Journée de l'indépendance numérique
brand_desc:
  en: A stylized smartphone breaking free from a severed cable, displaying a sprouting leaf on its screen to symbolize digital growth, nature, and freedom.
  fr: Un téléphone stylisé se libérant d'un câble sectionné, avec une feuille qui germe sur son écran pour symboliser la croissance numérique, la nature et la liberté.

