how_heading:
  en: How it works
  fr: Comment ça marche
how_steps:
  en:
    - Pick one U.S. service you pay for or rely on.
    - Follow a switch recipe to move to a Canadian or non-U.S. option.
    - Cancel the old subscription, then tell someone what you did.
  fr:
    - Choisissez un service américain que vous payez ou utilisez.
    - Suivez une recette pour passer à une option canadienne ou non américaine.
    - Annulez l'ancien abonnement, puis parlez-en à quelqu'un.
how_pace:
  en: One service a month is enough. Skipping a month is fine.
  fr: Un service par mois suffit. Sauter un mois, ce n'est pas grave.
recipes_intro:
  en: Step-by-step guides for moving one service at a time.
  fr: Des guides étape par étape pour changer un service à la fois.
cancel_intro:
  en: U.S. subscriptions, how to cancel them, and what to use instead.
  fr: Des abonnements américains, comment les annuler et quoi utiliser à la place.
alternatives_intro:
  en: Every listing shows where the company is based, who owns it, and our source.
  fr: Chaque fiche indique le siège de l'entreprise, son propriétaire et notre source.
