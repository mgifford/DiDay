# The international movement: campaigns, coalitions and directories that exist
# outside Canada. Rendered at /world/.
#
# Rules for this file:
#   - `relationship` records what the link actually is. "related-campaign" never
#     means "chapter", and a similar name is not evidence of affiliation.
#   - `source_url` must be a page that supports the description above it.
#   - `image` stays null unless the licence allows reuse and permits it here.
#     Nothing is copied from another campaign's site.
#   - Entries are verified against the source by a maintainer, not by an
#     automated check, which is why `verified` starts false.
#
# Checked against the sources on 2026-11-12.
#
# Relationship values:
#   international-initiative  a coalition or project coordinating DI.DAY itself
#   related-campaign          a national campaign sharing the first-Sunday idea
#   event-directory           a maintained list of events, not a campaign

